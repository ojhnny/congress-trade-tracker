[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "congress-trades"
version = "0.1.0"
description = "Does Congress trade what it regulates? A pipeline joining congressional stock trade disclosures to committee assignments."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are added section by section as the pipeline grows.
# Inside the Airflow image they are installed against Airflow's constraint
# file, so versions here are lower bounds only, never exact pins.
dependencies = [
    "requests>=2.31",
    "pdfplumber>=0.11",
    "pyyaml>=6",
]

[project.scripts]
congress-trades = "congress_trades.cli:main"

[project.optional-dependencies]
local = [
    "duckdb>=1.1",
    "dbt-core~=1.12.0",
    "dbt-duckdb~=1.10",
]
gcp = [
    "google-cloud-storage>=2.18",
    "google-cloud-bigquery>=3.25",
]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
