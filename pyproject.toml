[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "congress-trades"
version = "0.1.0"
description = "Does Congress trade what it regulates? A pipeline joining congressional stock trade disclosures to committee assignments."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are added section by section as the pipeline grows.
# Inside the Airflow image they are installed against Airflow's constraint
# file, so versions here are lower bounds only, never exact pins.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
